<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>KNUH 조식·야식 신청 사용 가이드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
      background: #0b0d10;
      color: #ecedef;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    :root {
      --bg: #0b0d10;
      --surface: #15181d;
      --surface-2: #1c2027;
      --border: #2a3038;
      --text: #ecedef;
      --text-soft: #b8bcc4;
      --muted: #7c828d;
      --accent: #e23a3f;
      --breakfast: #f5a524;
      --late-night: #7c5dfa;
      --success: #22c55e;
    }

    /* Background atmosphere */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(at 20% 10%, rgba(245,165,36,0.06) 0%, transparent 50%),
        radial-gradient(at 80% 90%, rgba(124,93,250,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: max(env(safe-area-inset-top), 20px) 20px max(env(safe-area-inset-bottom), 24px);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .brand {
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--accent);
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      margin-top: 2px;
      font-weight: 500;
    }
    .open-app {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-soft);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .15s;
    }
    .open-app:hover { border-color: var(--text-soft); color: var(--text); }

    /* Intro */
    .intro {
      text-align: center;
      padding: 12px 4px 20px;
    }
    .intro h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #ecedef 0%, #b8bcc4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Role tabs */
    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .role-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }
    .role-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }
    .role-btn .ico { margin-right: 6px; }

    /* Progress dots */
    .progress {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: all .25s;
      cursor: pointer;
    }
    .dot.active {
      width: 24px;
      border-radius: 999px;
      background: var(--accent);
      border-color: var(--accent);
    }
    .dot.done {
      background: var(--text-soft);
      border-color: var(--text-soft);
    }

    /* Slide container */
    .slide-wrap {
      position: relative;
      overflow: hidden;
      flex: 1;
    }
    .slide {
      animation: slideIn .35s cubic-bezier(.2, .8, .2, 1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .slide.from-left {
      animation: slideInLeft .35s cubic-bezier(.2, .8, .2, 1);
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-soft);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .step-num .role-ico { font-size: 13px; }

    h2.slide-title {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .slide-desc {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    /* Mock screen frame (phone-like preview) */
    .mock {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .mock::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 24px;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, transparent 100%);
      pointer-events: none;
    }
    .mock-frame {
      background: var(--bg);
      border-radius: 14px;
      padding: 16px 14px;
      min-height: 280px;
    }

    .mock-brand {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }
    .mock-h {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .mock-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .mock-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .mock-card.hl {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(226,58,63,0.15);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(226,58,63,0.15); }
      50% { box-shadow: 0 0 0 6px rgba(226,58,63,0.08); }
    }

    .choice-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .choice-pair .mock-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 18px 8px;
      margin: 0;
    }
    .choice-emoji { font-size: 28px; }
    .choice-name { font-size: 13px; font-weight: 700; }
    .choice-pair .breakfast { background: linear-gradient(180deg, rgba(245,165,36,0.18) 0%, var(--surface) 80%); }
    .choice-pair .late_night { background: linear-gradient(180deg, rgba(124,93,250,0.18) 0%, var(--surface) 80%); }

    .date-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin: 8px 0;
    }
    .date-cell {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
      font-size: 10px;
      color: var(--text-soft);
    }
    .date-cell .d { font-size: 13px; font-weight: 700; color: var(--text); display: block; margin-top: 2px; }
    .date-cell.sel { background: var(--accent); border-color: var(--accent); }
    .date-cell.sel, .date-cell.sel .d { color: #fff; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 8px 0;
    }
    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-soft);
    }
    .chip.sel {
      background: var(--breakfast);
      border-color: var(--breakfast);
      color: #2a1c00;
      font-weight: 700;
    }
    .chip .rank {
      background: rgba(0,0,0,0.2);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-size: 9px;
      font-weight: 800;
      margin-right: 3px;
    }

    .mock-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-top: 6px;
    }

    /* Person card (acting) */
    .person-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .person-card .badge {
      width: 32px; height: 32px;
      background: rgba(245,165,36,0.2);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .person-card .body { flex: 1; min-width: 0; }
    .person-card .name { font-size: 13px; font-weight: 700; color: var(--text); }
    .person-card .name small { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .person-card .menu { font-size: 11px; color: var(--text-soft); margin-top: 1px; }
    .person-card .arrow { color: var(--muted); }

    /* Barcode preview */
    .barcode-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      color: #111;
    }
    .bc-name { font-size: 18px; font-weight: 800; }
    .bc-eid { font-size: 12px; color: #666; margin-bottom: 8px; }
    .bc-menu {
      font-size: 11px;
      color: #333;
      background: #fafafa;
      padding: 6px 8px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
      margin-bottom: 10px;
    }
    .bc-lines {
      height: 36px;
      background: repeating-linear-gradient(
        90deg,
        #000 0px, #000 2px,
        transparent 2px, transparent 4px,
        #000 4px, #000 5px,
        transparent 5px, transparent 9px,
        #000 9px, #000 12px,
        transparent 12px, transparent 14px
      );
      margin-bottom: 4px;
    }
    .bc-num {
      text-align: center;
      font-size: 11px;
      color: #333;
      font-variant-numeric: tabular-nums;
    }
    .bc-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .bc-actions .b {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }
    .bc-actions .b.dark { background: #111; color: #fff; }
    .bc-actions .b.light { background: #f3f4f6; color: #111; }

    /* Tip box */
    .tips {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .tips-h {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .tips ul { margin: 0; padding-left: 18px; }
    .tips li {
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 4px;
    }
    .tips li:last-child { margin-bottom: 0; }
    .tips strong { color: var(--text); font-weight: 700; }
    .key {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      font-family: ui-monospace, monospace;
    }

    /* Nav bar */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .nav-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      min-width: 90px;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--text-soft);
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .nav-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .nav-btn.primary:hover { background: #ef4348; }
    .nav-count {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Finish overlay */
    .finish {
      text-align: center;
      padding: 30px 20px;
    }
    .finish-emoji {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .finish h2 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
    }
    .finish p {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 auto 22px;
      max-width: 380px;
    }
    .finish-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
    }
    .finish-btn:hover { background: #ef4348; }

    /* Acting accent (purple) */
    body[data-role="acting"] .step-num .role-ico,
    body[data-role="acting"] .person-card .badge {
      background: rgba(124,93,250,0.2);
    }
    body[data-role="acting"] .mock-card.hl {
      border-color: var(--late-night);
      box-shadow: 0 0 0 3px rgba(124,93,250,0.15);
      animation: pulseLate 1.5s ease-in-out infinite;
    }
    @keyframes pulseLate {
      0%, 100% { box-shadow: 0 0 0 3px rgba(124,93,250,0.15); }
      50% { box-shadow: 0 0 0 6px rgba(124,93,250,0.08); }
    }
    body[data-role="acting"] .dot.active {
      background: var(--late-night);
      border-color: var(--late-night);
    }
    body[data-role="acting"] .nav-btn.primary {
      background: var(--late-night);
      border-color: var(--late-night);
    }
    body[data-role="acting"] .nav-btn.primary:hover { background: #8b6efb; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        KNUH
        <small>USAGE GUIDE</small>
      </div>
      <a href="/" class="open-app">앱 열기 →</a>
    </div>

    <div class="intro">
      <h1>3분이면 끝나는 사용 안내</h1>
      <p>조식·야식 신청부터 받아오기까지<br />어떻게 쓰는지 슬라이드로 한번 훑어보세요</p>
    </div>

    <div class="role-switch" role="tablist">
      <button class="role-btn active" data-role="applicant"><span class="ico">🙋</span>신청자용</button>
      <button class="role-btn" data-role="acting"><span class="ico">🏃</span>액팅용</button>
    </div>

    <div class="progress" id="progress"></div>

    <div class="slide-wrap" id="slideWrap"></div>

    <div class="nav">
      <button class="nav-btn" id="prevBtn">‹ 이전</button>
      <div class="nav-count" id="navCount"></div>
      <button class="nav-btn primary" id="nextBtn">다음 ›</button>
    </div>
  </div>

  <script>
  (function() {
    const slides = {
      applicant: [
        {
          title: '첫 접속 — 한 번만 등록',
          desc: '사번과 이름을 입력하면 다음부터는 자동으로 로그인됩니다. 사번이 그대로 본인 명찰의 바코드와 동일합니다.',
          mock: `
            <div class="mock-brand">KNUH 조식·야식 신청</div>
            <div class="mock-h">처음이신가요?</div>
            <div class="mock-sub">사번과 이름을 입력하면 다음부터는 자동 로그인됩니다.</div>
            <div class="mock-card">
              <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">사번</div>
              <div style="font-size:14px;color:var(--text);">22810</div>
            </div>
            <div class="mock-card">
              <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">이름</div>
              <div style="font-size:14px;color:var(--text);">이수진</div>
            </div>
            <div class="mock-btn">등록하고 시작하기</div>
          `,
          tips: [
            '<strong>홈 화면에 추가</strong>: Safari 공유 버튼 → "홈 화면에 추가"하면 앱처럼 사용할 수 있어요',
            '한 번 등록하면 그 폰에서는 다시 입력 안 해도 됩니다',
          ],
        },
        {
          title: '조식 또는 야식 선택',
          desc: '신청자 역할로 들어오면 어떤 식사를 신청할지 큰 카드로 고릅니다. 신청한 게 있으면 상단에 현황이 함께 보입니다.',
          mock: `
            <div class="mock-brand">KNUH 조식·야식 신청</div>
            <div class="mock-h">메뉴 신청</div>
            <div class="mock-sub">어떤 식사를 신청하시겠어요?</div>
            <div class="choice-pair">
              <div class="mock-card breakfast hl">
                <div class="choice-emoji">🍳</div>
                <div class="choice-name">조식</div>
                <div style="font-size:10px;color:var(--muted);">아침 식사</div>
              </div>
              <div class="mock-card late_night">
                <div class="choice-emoji">🍜</div>
                <div class="choice-name">야식</div>
                <div style="font-size:10px;color:var(--muted);">밤 야식</div>
              </div>
            </div>
          `,
          tips: [
            '조식은 단계가 좀 더 많고 (스낵픽이면 우선순위까지), 야식은 빠르게 끝납니다',
            '이미 신청한 게 있으면 현황 카드를 <strong>탭해서 본인 바코드</strong>도 바로 볼 수 있어요',
          ],
        },
        {
          title: '날짜 다중 선택',
          desc: '며칠 연속으로 근무한다면 한꺼번에 다 신청하세요. 오늘 / 내일 / 앞으로 3일 빠른 버튼도 있습니다.',
          mock: `
            <div class="step-num" style="margin-bottom:8px;">단계 1/3 · 날짜 선택</div>
            <div class="mock-h">날짜 선택</div>
            <div class="mock-sub">여러 날짜를 한번에 선택할 수 있어요.</div>
            <div class="chips" style="margin-bottom:10px;">
              <span class="chip">오늘</span>
              <span class="chip">내일</span>
              <span class="chip">앞으로 3일</span>
            </div>
            <div class="date-row">
              <div class="date-cell sel"><span style="color:#ff7878;">일</span><span class="d">17</span></div>
              <div class="date-cell sel">월<span class="d">18</span></div>
              <div class="date-cell sel">화<span class="d">19</span></div>
              <div class="date-cell">수<span class="d">20</span></div>
              <div class="date-cell">목<span class="d">21</span></div>
              <div class="date-cell">금<span class="d">22</span></div>
              <div class="date-cell"><span style="color:#5fa8ff;">토</span><span class="d">23</span></div>
            </div>
            <div class="mock-btn">3일 선택 · 다음으로</div>
          `,

    const finishSlide = {
      applicant: {
        emoji: '🎉',
        h: '준비 끝!',
        p: '이제 실제로 신청해보세요. 처음 등록 후엔 자동 로그인되니 두 번째부턴 진짜 빨라요.',
        btn: '신청하러 가기',
      },
      acting: {
        emoji: '🏃‍♀️',
        h: '받으러 갑시다!',
        p: '오늘 액팅이시면 지금 바로 들어가서 대기 중인 신청 확인해보세요. 모르겠으면 가이드 다시 봐도 됩니다.',
        btn: '액팅 화면 열기',
      },
    };

    let role = 'applicant';
    let idx = 0;
    const total = () => slides[role].length + 1; // +1 for finish

    const wrap = document.getElementById('slideWrap');
    const progress = document.getElementById('progress');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const navCount = document.getElementById('navCount');

    function renderProgress() {
      progress.innerHTML = '';
      for (let i = 0; i < total(); i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === idx ? ' active' : (i < idx ? ' done' : ''));
        d.addEventListener('click', () => {
          const dir = i > idx ? 'right' : 'left';
          idx = i;
          render(dir);
        });
        progress.appendChild(d);
      }
    }

    function render(dir) {
      const list = slides[role];
      const isFinish = idx >= list.length;
      const dirClass = dir === 'left' ? 'from-left' : '';

      if (isFinish) {
        const f = finishSlide[role];
        wrap.innerHTML = `
          <div class="slide ${dirClass}">
            <div class="finish">
              <div class="finish-emoji">${f.emoji}</div>
              <h2>${f.h}</h2>
              <p>${f.p}</p>
              <a href="/" class="finish-btn">${f.btn}</a>
            </div>
          </div>
        `;
      } else {
        const s = list[idx];
        wrap.innerHTML = `
          <div class="slide ${dirClass}">
            <div class="step-num">
              <span class="role-ico">${role === 'applicant' ? '🙋' : '🏃'}</span>
              ${role === 'applicant' ? '신청자' : '액팅'} · ${idx + 1} / ${list.length}
            </div>
            <h2 class="slide-title">${s.title}</h2>
            <p class="slide-desc">${s.desc}</p>
            <div class="mock">
              <div class="mock-frame">${s.mock}</div>
            </div>
            <div class="tips">
              <div class="tips-h">💡 알아두면 좋아요</div>
              <ul>${s.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>
          </div>
        `;
      }

      renderProgress();
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx >= total() - 1;
      nextBtn.textContent = isFinish ? '완료 ✓' : '다음 ›';
      navCount.textContent = `${idx + 1} / ${total()}`;
    }

    function switchRole(r) {
      if (r === role) return;
      role = r;
      idx = 0;
      document.body.dataset.role = r;
      document.querySelectorAll('.role-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.role === r);
      });
      render('right');
    }

    document.querySelectorAll('.role-btn').forEach(b =>
      b.addEventListener('click', () => switchRole(b.dataset.role)));

    prevBtn.addEventListener('click', () => {
      if (idx > 0) { idx--; render('left'); }
    });
    nextBtn.addEventListener('click', () => {
      if (idx < total() - 1) { idx++; render('right'); }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && !prevBtn.disabled) { idx--; render('left'); }
      if (e.key === 'ArrowRight' && !nextBtn.disabled) { idx++; render('right'); }
    });

    // Touch swipe
    let startX = null;
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (startX === null) return;
      const dx = (e.changedTouches[0].clientX) - startX;
      startX = null;
      if (Math.abs(dx) < 60) return;
      if (dx < 0 && !nextBtn.disabled) { idx++; render('right'); }
      else if (dx > 0 && !prevBtn.disabled) { idx--; render('left'); }
    });

    document.body.dataset.role = role;
    render('right');
  })();
